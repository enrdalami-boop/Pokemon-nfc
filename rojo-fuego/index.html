<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <title>Pokémon Rojo Fuego</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;
        }


        #game {

            width: 100%;
            height: 100%;
        }


        /* =========================
           PORTADA
        ========================== */

        #tituloPokemon {

            position: fixed;

            top: 7%;
            left: 0;

            width: 100%;

            z-index: 9999;

            text-align: center;

            pointer-events: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* POKÉMON */

        #tituloPokemon .pokemon {

            margin: 0;

            color: #ffffff;

            font-size: 40px;

            font-weight: 900;

            letter-spacing: 4px;

            line-height: 1;

            text-shadow:
                2px 2px 0 #ef3e3a,
                4px 4px 8px #000;
        }


        /* ROJO FUEGO */

        #tituloPokemon .rojoFuego {

            margin: 8px 0 0 0;

            color: #ef3e3a;

            font-size: 44px;

            font-weight: 900;

            letter-spacing: 3px;

            line-height: 1;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }


        /* EDICIÓN */

        #tituloPokemon p {

            margin-top: 12px;

            color: white;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        /* =========================
           CHARIZARD
        ========================== */

        #charizardInicio {

            position: fixed;

            top: 27%;
            left: 50%;

            transform:
                translateX(-50%);

            width: 170px;

            max-width: 45vw;

            height: auto;

            z-index: 9998;

            pointer-events: none;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            #tituloPokemon {

                top: 6%;
            }


            #tituloPokemon .pokemon {

                font-size: 36px;

                letter-spacing: 3px;
            }


            #tituloPokemon .rojoFuego {

                font-size: 39px;

                letter-spacing: 2px;
            }


            #tituloPokemon p {

                font-size: 13px;

                margin-top: 10px;
            }


            #charizardInicio {

                top: 27%;

                width: 165px;

                max-width: 45vw;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     PORTADA
========================== -->

<div id="tituloPokemon">

    <h1 class="pokemon">
        POKÉMON
    </h1>

    <h1 class="rojoFuego">
        ROJO FUEGO
    </h1>

    <p>
        EDICIÓN ROJO FUEGO
    </p>

</div>



<!-- =========================
     CHARIZARD
========================== -->

<img
    id="charizardInicio"
    src="./charizard.png"
    alt="Charizard"
>



<!-- =========================
     EMULADOR
========================== -->

<div id="game"></div>



<script>


    /* =========================
       EMULATORJS
    ========================== */

    window.EJS_player =
        "#game";


    window.EJS_core =
        "gba";


    window.EJS_gameName =
        "pokemon-rojo-fuego";


    /*
       IMPORTANTE:

       NUEVO ID para borrar de golpe
       la configuración antigua
       del mando de Rojo Fuego.
    */

    window.EJS_gameID =
        2004;


    window.EJS_gameUrl =
        "./roms/juego.gba";


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    window.EJS_startOnLoaded =
        false;


    window.EJS_startButtonName =
        "INICIAR JUEGO";


    window.EJS_alignStartButton =
        "center";


    window.EJS_color =
        "#ef3e3a";


    window.EJS_backgroundColor =
        "#000000";


    window.EJS_fixedSaveInterval =
        7000;


    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    /* =========================
       AL INICIAR EL JUEGO
    ========================== */

    window.EJS_onGameStart =
        function () {


            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );


            const charizard =
                document.getElementById(
                    "charizardInicio"
                );


            if (titulo) {

                titulo.style.display =
                    "none";

            }


            if (charizard) {

                charizard.style.display =
                    "none";

            }

        };


</script>


<script
    src="https://cdn.emulatorjs.org/4.2.3/data/loader.js">
</script>


</body>

</html>
