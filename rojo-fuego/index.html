<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Rojo Fuego</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #tituloPokemon {
            position: fixed;
            top: 12%;
            left: 0;
            width: 100%;
            z-index: 9999;
            text-align: center;
            pointer-events: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        #tituloPokemon h1 {
            margin: 0;
            color: #e53935;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }

        #tituloPokemon p {
            margin-top: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

    </style>

</head>

<body>


<div id="tituloPokemon">

    <h1>POKÉMON ROJO FUEGO</h1>

    <p>EDICIÓN ROJO FUEGO</p>

</div>


<div id="game"></div>


<script>

    window.EJS_player = "#game";

    window.EJS_core = "gba";

    window.EJS_gameName = "pokemon-rojo-fuego";

    window.EJS_gameID = 1004;

    window.EJS_gameUrl = "./roms/juego.gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";

    window.EJS_startOnLoaded = false;

    window.EJS_startButtonName =
        "INICIAR JUEGO";

    window.EJS_alignStartButton =
        "center";

    window.EJS_color =
        "#e53935";

    window.EJS_backgroundColor =
        "#000000";

    window.EJS_fixedSaveInterval =
        7000;

    window.EJS_defaultOptions = {
        "save-state-location": "browser"
    };

    window.EJS_onGameStart =
        function () {

            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );

            if (titulo) {
                titulo.style.display = "none";
            }

        };

</script>


<script src="https://cdn.emulatorjs.org/4.2.3/data/loader.js"></script>


</body>

</html>
