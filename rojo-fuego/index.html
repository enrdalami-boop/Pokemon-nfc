<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <title>Pokémon Rojo Fuego</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        #game {

            width: 100vw;
            height: 100dvh;

            background: #000;
        }


        /* =========================
           PORTADA
        ========================== */

        #tituloPokemon {

            position: fixed;

            top: 6%;
            left: 0;

            width: 100%;

            z-index: 9999;

            text-align: center;

            pointer-events: none;
        }


        #tituloPokemon .pokemon {

            margin: 0;

            color: #ffffff;

            font-size: 44px;

            font-weight: 900;

            letter-spacing: 4px;

            line-height: 1;

            text-shadow:
                3px 3px 0 #e53935,
                5px 5px 10px #000;
        }


        #tituloPokemon .rojoFuego {

            margin: 8px 0 0 0;

            color: #f44336;

            font-size: 48px;

            font-weight: 900;

            letter-spacing: 3px;

            line-height: 1;

            text-shadow:
                2px 2px 0 #ffffff,
                5px 5px 10px #000;
        }


        #tituloPokemon p {

            margin-top: 14px;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        /* =========================
           CHARIZARD
        ========================== */

        #charizardInicio {

            position: fixed;

            top: 27%;
            left: 50%;

            transform:
                translateX(-50%);

            width: 170px;

            max-width: 45vw;

            height: auto;

            z-index: 9998;

            pointer-events: none;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            #tituloPokemon {

                top: 6%;
            }


            #tituloPokemon .pokemon {

                font-size: 36px;

                letter-spacing: 3px;
            }


            #tituloPokemon .rojoFuego {

                font-size: 39px;

                letter-spacing: 2px;
            }


            #tituloPokemon p {

                font-size: 13px;

                margin-top: 10px;
            }


            #charizardInicio {

                top: 27%;

                width: 165px;

                max-width: 45vw;
            }

        }


        @media (max-height: 700px) {

            #tituloPokemon {

                top: 4%;
            }


            #tituloPokemon .pokemon {

                font-size: 31px;
            }


            #tituloPokemon .rojoFuego {

                font-size: 34px;
            }


            #tituloPokemon p {

                font-size: 11px;

                margin-top: 8px;
            }


            #charizardInicio {

                top: 25%;

                width: 140px;
            }

        }

    </style>

</head>


<body>


<!-- PORTADA -->

<div id="tituloPokemon">

    <h1 class="pokemon">
        POKÉMON
    </h1>

    <h1 class="rojoFuego">
        ROJO FUEGO
    </h1>

    <p>
        EDICIÓN ROJO FUEGO
    </p>

</div>


<img
    id="charizardInicio"
    src="./charizard.png"
    alt="Charizard"
>


<div id="game"></div>


<script>


    /* =========================
       EMULATORJS
    ========================== */

    window.EJS_player =
        "#game";


    window.EJS_core =
        "gba";


    window.EJS_controlScheme =
        "gba";


    window.EJS_gameName =
        "pokemon-rojo-fuego";


    window.EJS_gameID =
        1004;


    window.EJS_gameUrl =
        "./roms/juego.gba";


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    window.EJS_startOnLoaded =
        false;


    window.EJS_startButtonName =
        "INICIAR JUEGO";


    window.EJS_alignStartButton =
        "center";


    window.EJS_color =
        "#ef3e3a";


    window.EJS_backgroundColor =
        "#000000";


    window.EJS_fixedSaveInterval =
        7000;


    window.EJS_defaultOptions = {

        "save-state-location":
            "browser",

        "virtual-gamepad":
            "enabled"
    };


    /* =========================
       MANDO VIRTUAL GBA
    ========================== */

    window.EJS_VirtualGamepadSettings = [

        /* CRUCETA */

        {
            type: "dpad",

            location: "left",

            left: "50%",

            right: "50%",

            joystickInput: false,

            inputValues: [
                4,
                5,
                6,
                7
            ]
        },


        /* BOTÓN B */

        {
            type: "button",

            text: "B",

            id: "gba_b",

            location: "right",

            left: 0,

            top: 40,

            bold: true,

            fontSize: 30,

            input_value: 0
        },


        /* BOTÓN A */

        {
            type: "button",

            text: "A",

            id: "gba_a",

            location: "right",

            left: 85,

            top: 0,

            bold: true,

            fontSize: 30,

            input_value: 8
        },


        /* BOTÓN L */

        {
            type: "button",

            text: "L",

            id: "gba_l",

            location: "left",

            left: 0,

            top: -100,

            bold: true,

            fontSize: 25,

            input_value: 10
        },


        /* BOTÓN R */

        {
            type: "button",

            text: "R",

            id: "gba_r",

            location: "right",

            right: 0,

            top: -100,

            bold: true,

            fontSize: 25,

            input_value: 11
        },


        /* SELECT */

        {
            type: "button",

            text: "SELECT",

            id: "gba_select",

            location: "center",

            left: -90,

            top: -145,

            bold: true,

            fontSize: 13,

            block: true,

            input_value: 2
        },


        /* START */

        {
            type: "button",

            text: "START",

            id: "gba_start",

            location: "center",

            left: 15,

            top: -145,

            bold: true,

            fontSize: 13,

            block: true,

            input_value: 3
        }

    ];


    /* =========================
       AL INICIAR EL JUEGO
    ========================== */

    window.EJS_onGameStart =
        function () {


            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );


            const charizard =
                document.getElementById(
                    "charizardInicio"
                );


            if (titulo) {

                titulo.style.display =
                    "none";

            }


            if (charizard) {

                charizard.style.display =
                    "none";

            }

        };


</script>


<script
    src="https://cdn.emulatorjs.org/4.2.3/data/loader.js">
</script>


</body>

</html>
