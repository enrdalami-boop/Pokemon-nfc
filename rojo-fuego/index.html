<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Rojo Fuego</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* EMULADOR */

        #game {
            width: 100vw;
            height: 100vh;
        }


        /* TÍTULO DE LA PORTADA */

        #tituloPokemon {
            position: fixed;

            top: 7%;
            left: 0;

            width: 100%;

            z-index: 9999;

            text-align: center;

            pointer-events: none;
        }


        /* POKÉMON */

        #tituloPokemon .pokemon {

            margin: 0;

            color: #ffffff;

            font-size: 44px;

            font-weight: 900;

            letter-spacing: 4px;

            line-height: 1;

            text-shadow:
                3px 3px 0 #e53935,
                5px 5px 10px #000;
        }


        /* ROJO FUEGO */

        #tituloPokemon .rojoFuego {

            margin: 8px 0 0 0;

            color: #f44336;

            font-size: 48px;

            font-weight: 900;

            letter-spacing: 3px;

            line-height: 1;

            text-shadow:
                2px 2px 0 #ffffff,
                5px 5px 10px #000;
        }


        /* TEXTO DESCRIPTIVO */

        #tituloPokemon p {

            margin-top: 15px;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        /* CHARIZARD */

        #charizardInicio {

            position: fixed;

            top: 58%;
            left: 50%;

            transform: translateX(-50%);

            width: 270px;

            max-width: 65vw;

            height: auto;

            z-index: 9998;

            pointer-events: none;

            image-rendering: pixelated;
        }


        /* AJUSTES PARA MÓVIL */

        @media (max-width: 600px) {

            #tituloPokemon {
                top: 6%;
            }

            #tituloPokemon .pokemon {

                font-size: 37px;

                letter-spacing: 3px;
            }

            #tituloPokemon .rojoFuego {

                font-size: 39px;

                letter-spacing: 2px;
            }

            #tituloPokemon p {

                font-size: 13px;

                margin-top: 12px;
            }

            #charizardInicio {

                width: 230px;

                max-width: 68vw;

                top: 60%;
            }
        }


        /* PANTALLAS PEQUEÑAS */

        @media (max-height: 650px) {

            #tituloPokemon {
                top: 4%;
            }

            #tituloPokemon .pokemon {
                font-size: 32px;
            }

            #tituloPokemon .rojoFuego {
                font-size: 35px;
            }

            #tituloPokemon p {
                margin-top: 8px;
            }

            #charizardInicio {

                width: 190px;

                top: 61%;
            }
        }

    </style>

</head>


<body>


<!-- PORTADA -->

<div id="tituloPokemon">

    <h1 class="pokemon">
        POKÉMON
    </h1>

    <h1 class="rojoFuego">
        ROJO FUEGO
    </h1>

    <p>
        EDICIÓN ROJO FUEGO
    </p>

</div>


<!-- CHARIZARD -->

<img
    id="charizardInicio"
    src="./charizard.png"
    alt="Charizard"
>


<!-- EMULADOR -->

<div id="game"></div>


<script>

    window.EJS_player = "#game";


    /* Game Boy Advance */

    window.EJS_core = "gba";


    /* Nombre independiente del juego */

    window.EJS_gameName =
        "pokemon-rojo-fuego";


    /* ID diferente al resto */

    window.EJS_gameID =
        1004;


    /* Archivo del juego */

    window.EJS_gameUrl =
        "./roms/juego.gba";


    /* EmulatorJS */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    /* NO iniciar automáticamente */

    window.EJS_startOnLoaded =
        false;


    /* Texto del botón */

    window.EJS_startButtonName =
        "INICIAR JUEGO";


    /* Botón centrado */

    window.EJS_alignStartButton =
        "center";


    /* Color rojo */

    window.EJS_color =
        "#ef3e3a";


    /* Fondo negro */

    window.EJS_backgroundColor =
        "#000000";


    /* Guardado automático */

    window.EJS_fixedSaveInterval =
        7000;


    /* Guardar partidas en el navegador */

    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    /*
       CUANDO EMPIEZA EL JUEGO
       desaparecen título y Charizard
    */

    window.EJS_onGameStart =
        function () {

            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );

            const charizard =
                document.getElementById(
                    "charizardInicio"
                );


            if (titulo) {

                titulo.style.display =
                    "none";

            }


            if (charizard) {

                charizard.style.display =
                    "none";

            }

        };

</script>


<script
    src="https://cdn.emulatorjs.org/4.2.3/data/loader.js">
</script>


</body>

</html>
