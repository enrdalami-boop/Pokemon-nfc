<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Verde</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #tituloPokemon {
            position: fixed;

            top: 12%;
            left: 0;

            width: 100%;

            z-index: 9999;

            text-align: center;

            pointer-events: none;

            font-family: Arial, Helvetica, sans-serif;
        }

        #tituloPokemon h1 {

            margin: 0;

            color: #39b54a;

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 2px;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }

        #tituloPokemon p {

            margin-top: 8px;

            color: white;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 1px;
        }

    </style>

</head>


<body>


<!-- TÍTULO -->

<div id="tituloPokemon">

    <h1>
        POKÉMON VERDE
    </h1>

    <p>
        EDICIÓN VERDE
    </p>

</div>


<!-- EMULADOR -->

<div id="game"></div>


<script>

    /*
    ========================================
    CONFIGURACIÓN DEL JUEGO
    ========================================
    */

    window.EJS_player = "#game";


    /*
    GAME BOY
    */

    window.EJS_core = "gb";


    /*
    NOMBRE DEL JUEGO
    */

    window.EJS_gameName = "pokemon-verde";


    /*
    ID DEL JUEGO

    Amarillo = 1001
    Azul = 1002
    Verde = 1003

    NO CAMBIARLO DESPUÉS,
    PARA CONSERVAR LOS GUARDADOS.
    */

    window.EJS_gameID = 1003;


    /*
    ARCHIVO DEL JUEGO
    */

    window.EJS_gameUrl = "./roms/juego.gb";


    /*
    EMULATORJS
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    /*
    NO ARRANCAR HASTA QUE
    EL USUARIO PULSE EL BOTÓN
    */

    window.EJS_startOnLoaded = false;


    /*
    TEXTO DEL BOTÓN
    */

    window.EJS_startButtonName =
        "INICIAR JUEGO";


    /*
    BOTÓN CENTRADO
    */

    window.EJS_alignStartButton =
        "center";


    /*
    COLOR VERDE
    */

    window.EJS_color =
        "#39b54a";


    /*
    FONDO NEGRO
    */

    window.EJS_backgroundColor =
        "#000000";


    /*
    GUARDADO PERIÓDICO
    */

    window.EJS_fixedSaveInterval =
        7000;


    /*
    SAVE STATES EN EL NAVEGADOR
    */

    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    /*
    AL COMENZAR EL JUEGO
    QUITAMOS EL TÍTULO
    */

    window.EJS_onGameStart =
        function () {

            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );

            if (titulo) {

                titulo.style.display =
                    "none";

            }

        };


</script>


<script src="https://cdn.emulatorjs.org/4.2.3/data/loader.js"></script>


</body>

</html>
