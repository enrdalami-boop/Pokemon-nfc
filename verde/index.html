<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Verde</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #inicio {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #242424 0%,
                    #101010 55%,
                    #000000 100%
                );

            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #titulo {
            color: #35c653;

            font-size: 36px;
            font-weight: 900;

            margin: 0 0 8px 0;

            letter-spacing: 2px;

            line-height: 1.15;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px rgba(0,0,0,0.8);
        }

        #subtitulo {
            color: white;

            font-size: 15px;
            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 35px;

            opacity: 0.95;
        }

        #iniciar {
            background: #35c653;
            color: white;

            border: none;
            border-radius: 14px;

            padding: 18px 40px;

            font-size: 20px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 7px 0 #218c38,
                0 11px 20px rgba(0,0,0,0.45);

            transition:
                transform 0.1s ease,
                box-shadow 0.1s ease;
        }

        #iniciar:active {
            transform: translateY(4px);

            box-shadow:
                0 3px 0 #218c38,
                0 6px 10px rgba(0,0,0,0.45);
        }

        #iniciar:disabled {
            opacity: 0.7;
        }

        #estado {
            margin-top: 22px;
            color: white;
            font-size: 14px;
            min-height: 20px;
        }

        #aviso {
            color: #aaa;

            font-size: 12px;

            margin-top: 70px;

            max-width: 330px;

            line-height: 1.5;
        }

    </style>

</head>


<body>

<div id="game"></div>


<div id="inicio">

    <h1 id="titulo">
        POKÉMON<br>
        VERDE
    </h1>

    <div id="subtitulo">
        EDICIÓN VERDE
    </div>

    <button id="iniciar">
        INICIAR JUEGO
    </button>

    <div id="estado"></div>

    <div id="aviso">
        Guarda la partida desde el menú del juego y espera
        unos segundos antes de cerrar.
    </div>

</div>


<script>

    window.EJS_player = "#game";

    window.EJS_core = "gb";

    window.EJS_gameName = "pokemon-verde";

    window.EJS_gameID = 1003;

    window.EJS_gameUrl =
        "./roms/juego.gb";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";

    window.EJS_startOnLoaded = true;

    window.EJS_fixedSaveInterval =
        7000;

    window.EJS_defaultOptions = {
        "save-state-location": "browser"
    };


    const boton =
        document.getElementById("iniciar");

    const estado =
        document.getElementById("estado");

    const pantallaInicio =
        document.getElementById("inicio");


    boton.addEventListener(
        "click",
        function () {

            boton.disabled = true;

            boton.textContent =
                "CARGANDO...";

            estado.textContent =
                "Preparando Pokémon Verde...";

            const script =
                document.createElement("script");

            script.src =
                "https://cdn.emulatorjs.org/4.2.3/data/loader.js";

            script.onload =
                function () {

                    pantallaInicio.style.display =
                        "none";

                };

            script.onerror =
                function () {

                    boton.disabled = false;

                    boton.textContent =
                        "REINTENTAR";

                    estado.textContent =
                        "No se pudo cargar el emulador.";

                };

            document.body.appendChild(script);

        }
    );

</script>

</body>

</html>
