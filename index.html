<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Amarillo</title>

    <link rel="preload"
          href="./roms/juego.gb"
          as="fetch">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #inicio {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #333 0%,
                    #111 55%,
                    #000 100%
                );

            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #titulo {
            color: #ffdc00;
            font-size: 36px;
            font-weight: 900;
            margin: 0 0 8px 0;
            letter-spacing: 2px;

            text-shadow:
                2px 2px 0 #1d4fa3,
                4px 4px 8px rgba(0,0,0,0.8);
        }

        #subtitulo {
            color: white;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        #iniciar {
            background: #ffdc00;
            color: #111;

            border: none;
            border-radius: 14px;

            padding: 18px 34px;

            font-size: 20px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 6px 0 #c9a900,
                0 10px 20px rgba(0,0,0,0.45);

            transition:
                transform 0.1s ease,
                box-shadow 0.1s ease;
        }

        #iniciar:active {
            transform: translateY(4px);

            box-shadow:
                0 2px 0 #c9a900,
                0 5px 10px rgba(0,0,0,0.45);
        }

        #iniciar:disabled {
            opacity: 0.7;
            cursor: default;
        }

        #estado {
            margin-top: 22px;
            color: white;
            font-size: 14px;
            min-height: 20px;
        }

        #aviso {
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
            max-width: 300px;
            line-height: 1.4;
        }

    </style>

</head>


<body>


<div id="game"></div>


<div id="inicio">

    <h1 id="titulo">
        POKÉMON AMARILLO
    </h1>

    <div id="subtitulo">
        EDICIÓN ESPECIAL PIKACHU
    </div>

    <button id="iniciar">
        INICIAR JUEGO
    </button>

    <div id="estado"></div>

    <div id="aviso">
        Guarda la partida desde el menú del juego
        y espera unos segundos antes de cerrar.
    </div>

</div>


<script>

    /*
    =========================================
    CONFIGURACIÓN POKÉMON AMARILLO
    =========================================
    */


    /*
    EMULADOR
    */

    window.EJS_player = "#game";


    /*
    NÚCLEO mGBA

    Aunque la ROM sea .gb,
    utilizamos mGBA.
    */

    window.EJS_core = "mgba";


    /*
    CONTROLES DE GAME BOY

    Evita controles L/R de Game Boy Advance.
    */

    window.EJS_controlScheme = "gb";


    /*
    NOMBRE DEL JUEGO
    */

    window.EJS_gameName =
        "pokemon-amarillo";


    /*
    ID ÚNICO

    Amarillo = 1001
    Azul     = 1002
    Verde    = 1003

    NO CAMBIAR ESTE NÚMERO.
    */

    window.EJS_gameID = 1001;


    /*
    ROM POKÉMON AMARILLO
    */

    window.EJS_gameUrl =
        new URL(
            "./roms/juego.gb",
            window.location.href
        ).href;


    /*
    ARCHIVOS EMULATORJS
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    /*
    EL EMULADOR ARRANCA
    DESPUÉS DE PULSAR NUESTRO BOTÓN
    */

    window.EJS_startOnLoaded = true;


    /*
    GUARDADO PERIÓDICO
    */

    window.EJS_fixedSaveInterval =
        7000;


    /*
    =========================================
    CONFIGURACIÓN mGBA
    =========================================
    */

    window.EJS_defaultOptions = {

        /*
        QUITAR MARCO SUPER GAME BOY
        */

        "mgba_sgb_borders":
            "OFF",


        /*
        FORZAR GAME BOY COLOR

        Evita que Pokémon Amarillo
        muestre el marco Super Game Boy.
        */

        "mgba_gb_model":
            "Game Boy Color",


        /*
        GUARDADOS DEL EMULADOR
        EN EL NAVEGADOR
        */

        "save-state-location":
            "browser"

    };


    /*
    BOTONES DEL EMULADOR
    */

    window.EJS_Buttons = {

        saveSavFiles: {
            visible: true
        },

        loadSavFiles: {
            visible: true
        },

        saveState: {
            visible: true
        },

        loadState: {
            visible: true
        },

        fullscreen: {
            visible: true
        }

    };


    /*
    =========================================
    PANTALLA INICIAL
    =========================================
    */

    const boton =
        document.getElementById("iniciar");

    const estado =
        document.getElementById("estado");

    const pantallaInicio =
        document.getElementById("inicio");


    /*
    AL PULSAR INICIAR JUEGO
    */

    boton.addEventListener(
        "click",
        function () {

            boton.disabled = true;

            boton.textContent =
                "CARGANDO...";

            estado.textContent =
                "Preparando Pokémon Amarillo...";


            /*
            CARGAMOS EMULATORJS
            DESPUÉS DEL TOQUE
            */

            const script =
                document.createElement("script");


            script.src =
                "https://cdn.emulatorjs.org/4.2.3/data/loader.js";


            /*
            CUANDO EL EMULADOR
            SE HAYA CARGADO
            */

            script.onload =
                function () {

                    pantallaInicio.style.display =
                        "none";

                };


            /*
            SI HAY ERROR
            */

            script.onerror =
                function () {

                    boton.disabled = false;

                    boton.textContent =
                        "REINTENTAR";

                    estado.textContent =
                        "No se pudo cargar el emulador. Comprueba la conexión.";

                };


            document.body.appendChild(script);

        }
    );

</script>


</body>

</html>
