<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Amarillo</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }


        /* =========================
           PORTADA
        ========================== */

        #inicio {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            text-align: center;
            overflow: hidden;
        }


        /* =========================
           TÍTULO
        ========================== */

        #tituloPokemon {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }


        #tituloPokemon .pokemon {
            margin: 0;

            color: #ffffff;

            font-size: 40px;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1;

            text-shadow:
                2px 2px 0 #ffdc00,
                4px 4px 8px #000;
        }


        #tituloPokemon .amarillo {
            margin: 8px 0 0 0;

            color: #ffdc00;

            font-size: 44px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }


        #tituloPokemon p {
            margin-top: 12px;

            color: white;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }


        /* =========================
           PIKACHU
        ========================== */

        #pikachuInicio {
            position: absolute;

            top: 39%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 220px;

            max-width: 58vw;

            height: auto;

            pointer-events: none;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }


        /* =========================
           BOTÓN INICIAR
        ========================== */

        #iniciar {
            position: absolute;

            top: 54%;
            left: 50%;

            transform:
                translateX(-50%);

            min-width: 220px;

            background:
                #ffdc00;

            color:
                #111;

            border: none;

            border-radius: 30px;

            padding:
                14px 30px;

            font-size: 18px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.5);

            white-space: nowrap;
        }


        #iniciar:active {
            transform:
                translateX(-50%)
                scale(0.97);
        }


        #iniciar:disabled {
            opacity: 0.7;
            cursor: default;
        }


        /* =========================
           ESTADO
        ========================== */

        #estado {
            position: absolute;

            top: 64%;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;

            color: white;

            font-size: 13px;

            min-height: 18px;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            #tituloPokemon {
                top: 5%;
            }


            #tituloPokemon .pokemon {
                font-size: 36px;
                letter-spacing: 3px;
            }


            #tituloPokemon .amarillo {
                font-size: 39px;
                letter-spacing: 2px;
            }


            #tituloPokemon p {
                font-size: 13px;
                margin-top: 10px;
            }


            #pikachuInicio {
                top: 39%;
                width: 205px;
                max-width: 58vw;
            }


            #iniciar {
                top: 54%;
                min-width: 215px;
                font-size: 17px;
                padding: 13px 28px;
            }


            #estado {
                top: 64%;
            }

        }


        /* =========================
           PANTALLAS BAJAS
        ========================== */

        @media (max-height: 700px) {

            #tituloPokemon {
                top: 3%;
            }


            #tituloPokemon .pokemon {
                font-size: 31px;
            }


            #tituloPokemon .amarillo {
                font-size: 34px;
            }


            #tituloPokemon p {
                font-size: 11px;
                margin-top: 7px;
            }


            #pikachuInicio {
                top: 37%;
                width: 180px;
            }


            #iniciar {
                top: 53%;
                font-size: 15px;
                padding: 11px 24px;
            }


            #estado {
                top: 63%;
            }

        }

    </style>

</head>

<body>


<!-- EMULADOR -->

<div id="game"></div>


<!-- PORTADA -->

<div id="inicio">


    <div id="tituloPokemon">

        <h1 class="pokemon">
            POKÉMON
        </h1>

        <h1 class="amarillo">
            AMARILLO
        </h1>

        <p>
            EDICIÓN ESPECIAL PIKACHU
        </p>

    </div>


    <!-- PIKACHU -->

    <img
        id="pikachuInicio"
        src="./pikachu.png"
        alt="Pikachu"
    >


    <!-- BOTÓN -->

    <button id="iniciar">
        INICIAR JUEGO
    </button>


    <div id="estado"></div>


</div>


<script>

    /*
    =========================================
    POKÉMON AMARILLO
    =========================================
    */


    window.EJS_player =
        "#game";


    /*
    NÚCLEO mGBA
    */

    window.EJS_core =
        "mgba";


    /*
    CONTROLES GAME BOY
    */

    window.EJS_controlScheme =
        "gb";


    /*
    INTERFAZ MÓVIL
    */

    window.EJS_browserMode =
        "mobile";


    /*
    NOMBRE
    */

    window.EJS_gameName =
        "pokemon-amarillo";


    /*
    ID ÚNICO
    */

    window.EJS_gameID =
        1001;


    /*
    ROM
    */

    window.EJS_gameUrl =
        "./roms/juego.gb";


    /*
    EMULATORJS
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    /*
    Arranca al cargar EmulatorJS
    después de pulsar nuestro botón.
    */

    window.EJS_startOnLoaded =
        true;


    /*
    COLOR
    */

    window.EJS_color =
        "#ffdc00";


    /*
    FONDO
    */

    window.EJS_backgroundColor =
        "#000000";


    /*
    GUARDADO
    */

    window.EJS_fixedSaveInterval =
        7000;


    /*
    =========================================
    OPCIONES mGBA
    =========================================
    */

    window.EJS_defaultOptions = {

        "mgba_sgb_borders":
            "OFF",

        "mgba_gb_model":
            "Game Boy Color",

        "save-state-location":
            "browser"

    };


    /*
    =========================================
    BOTONES DEL EMULADOR
    =========================================
    */

    window.EJS_Buttons = {

        saveSavFiles: {
            visible: true
        },

        loadSavFiles: {
            visible: true
        },

        saveState: {
            visible: true
        },

        loadState: {
            visible: true
        },

        fullscreen: {
            visible: true
        }

    };


    /*
    =========================================
    PORTADA
    =========================================
    */

    const boton =
        document.getElementById(
            "iniciar"
        );


    const estado =
        document.getElementById(
            "estado"
        );


    const pantallaInicio =
        document.getElementById(
            "inicio"
        );


    /*
    =========================================
    AL PULSAR INICIAR
    =========================================
    */

    boton.addEventListener(

        "click",

        function () {


            boton.disabled =
                true;


            boton.textContent =
                "CARGANDO...";


            estado.textContent =
                "Preparando Pokémon Amarillo...";


            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://cdn.emulatorjs.org/4.2.3/data/loader.js";


            script.onload =
                function () {


                    pantallaInicio.style.display =
                        "none";


                };


            script.onerror =
                function () {


                    boton.disabled =
                        false;


                    boton.textContent =
                        "REINTENTAR";


                    estado.textContent =
                        "No se pudo cargar el emulador. Comprueba la conexión.";


                };


            document.body.appendChild(
                script
            );


        }

    );


</script>


</body>

</html>
