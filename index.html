<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Amarillo</title>

    <!-- Precargamos la ROM para evitar el problema de la primera apertura -->
    <link rel="preload"
          href="./roms/juego.gb"
          as="fetch">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #inicio {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #iniciar {
            font-size: 20px;
            font-weight: bold;
            padding: 18px 30px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
        }

        #estado {
            margin-top: 18px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="game"></div>

<div id="inicio">
    <button id="iniciar">INICIAR JUEGO</button>
    <div id="estado"></div>
</div>

<script>

    /*
       CONFIGURACIÓN DEL JUEGO
    */

    window.EJS_player = "#game";

    window.EJS_core = "gb";

    window.EJS_gameName = "mi-juego";

    /*
       NO CAMBIAR ESTE ID.
       Mantenerlo permite conservar los mismos guardados.
    */
    window.EJS_gameID = 1001;

    /*
       Creamos una dirección absoluta a la ROM.
    */
    window.EJS_gameUrl =
        new URL("./roms/juego.gb", window.location.href).href;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";

    /*
       Después del toque del usuario podemos iniciar automáticamente.
    */
    window.EJS_startOnLoaded = true;

    /*
       Guardar periódicamente.
    */
    window.EJS_fixedSaveInterval = 7000;

    window.EJS_defaultOptions = {
        "save-state-location": "browser"
    };

    window.EJS_Buttons = {

        saveSavFiles: {
            visible: true
        },

        loadSavFiles: {
            visible: true
        },

        saveState: {
            visible: true
        },

        loadState: {
            visible: true
        },

        fullscreen: {
            visible: true
        }
    };


    /*
       BOTÓN DE INICIO
    */

    const boton = document.getElementById("iniciar");
    const estado = document.getElementById("estado");
    const pantallaInicio = document.getElementById("inicio");

    boton.addEventListener("click", function () {

        /*
           Impedimos pulsarlo dos veces.
        */
        boton.disabled = true;
        boton.textContent = "CARGANDO...";
        estado.textContent = "Preparando el juego...";

        /*
           Solo AHORA cargamos EmulatorJS.
        */
        const script = document.createElement("script");

        script.src =
            "https://cdn.emulatorjs.org/4.2.3/data/loader.js";

        script.onload = function () {

            /*
               Quitamos nuestra pantalla de inicio.
            */
            pantallaInicio.style.display = "none";
        };

        script.onerror = function () {

            boton.disabled = false;
            boton.textContent = "REINTENTAR";
            estado.textContent =
                "No se pudo cargar el emulador. Comprueba la conexión.";
        };

        document.body.appendChild(script);
    });

</script>

</body>
</html>
