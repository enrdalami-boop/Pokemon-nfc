<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Azul</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }


        /* =========================
           PORTADA
        ========================== */

        #inicio {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            text-align: center;
            overflow: hidden;
        }


        /* =========================
           TÍTULO
        ========================== */

        #tituloPokemon {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }


        #tituloPokemon .pokemon {
            margin: 0;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1;

            text-shadow:
                2px 2px 0 #2196f3,
                4px 4px 8px #000;
        }


        #tituloPokemon .azul {
            margin: 8px 0 0 0;
            color: #2196f3;
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }


        #tituloPokemon p {
            margin-top: 12px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }


        /* =========================
           BLASTOISE
           140 % DEL TAMAÑO ANTERIOR
        ========================== */

        #blastoiseInicio {
            position: absolute;

            top: 39%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 308px;
            max-width: 80vw;
            height: auto;

            pointer-events: none;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }


        /* =========================
           BOTÓN INICIAR
        ========================== */

        #iniciar {
            position: absolute;

            top: 67%;
            left: 50%;

            transform:
                translateX(-50%);

            min-width: 220px;

            background:
                #2196f3;

            color:
                white;

            border: none;
            border-radius: 30px;

            padding:
                14px 30px;

            font-size: 18px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.5);

            white-space: nowrap;
        }


        #iniciar:active {
            transform:
                translateX(-50%)
                scale(0.97);
        }


        #iniciar:disabled {
            opacity: 0.7;
            cursor: default;
        }


        /* =========================
           ESTADO
        ========================== */

        #estado {
            position: absolute;

            top: 77%;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;

            color: white;
            font-size: 13px;
            min-height: 18px;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            #tituloPokemon {
                top: 5%;
            }


            #tituloPokemon .pokemon {
                font-size: 36px;
                letter-spacing: 3px;
            }


            #tituloPokemon .azul {
                font-size: 39px;
                letter-spacing: 2px;
            }


            #tituloPokemon p {
                font-size: 13px;
                margin-top: 10px;
            }


            #blastoiseInicio {
                top: 39%;
                width: 287px;
                max-width: 80vw;
            }


            #iniciar {
                top: 67%;
                min-width: 215px;
                font-size: 17px;
                padding: 13px 28px;
            }


            #estado {
                top: 77%;
            }

        }


        /* =========================
           PANTALLAS BAJAS
        ========================== */

        @media (max-height: 700px) {

            #tituloPokemon {
                top: 3%;
            }


            #tituloPokemon .pokemon {
                font-size: 31px;
            }


            #tituloPokemon .azul {
                font-size: 34px;
            }


            #tituloPokemon p {
                font-size: 11px;
                margin-top: 7px;
            }


            #blastoiseInicio {
                top: 37%;
                width: 252px;
                max-width: 78vw;
            }


            #iniciar {
                top: 64%;
                font-size: 15px;
                padding: 11px 24px;
            }


            #estado {
                top: 74%;
            }

        }

    </style>

</head>


<body>


<!-- EMULADOR -->

<div id="game"></div>


<!-- PORTADA -->

<div id="inicio">


    <div id="tituloPokemon">

        <h1 class="pokemon">
            POKÉMON
        </h1>

        <h1 class="azul">
            AZUL
        </h1>

        <p>
            EDICIÓN AZUL
        </p>

    </div>


    <!-- BLASTOISE -->

    <img
        id="blastoiseInicio"
        src="./blastoise.png"
        alt="Blastoise"
    >


    <!-- BOTÓN -->

    <button id="iniciar">
        INICIAR JUEGO
    </button>


    <div id="estado"></div>


</div>


<script>

    window.EJS_player =
        "#game";


    window.EJS_core =
        "gba";


    window.EJS_controlScheme =
        "gba";


    window.EJS_browserMode =
        "mobile";


    window.EJS_gameName =
        "pokemon-azul";


    window.EJS_gameID =
        1002;


    window.EJS_gameUrl =
        "./roms/juego.gba";


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    window.EJS_startOnLoaded =
        true;


    window.EJS_color =
        "#2196f3";


    window.EJS_backgroundColor =
        "#000000";


    window.EJS_fixedSaveInterval =
        7000;


    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    const boton =
        document.getElementById(
            "iniciar"
        );


    const estado =
        document.getElementById(
            "estado"
        );


    const pantallaInicio =
        document.getElementById(
            "inicio"
        );


    boton.addEventListener(

        "click",

        function () {


            boton.disabled =
                true;


            boton.textContent =
                "CARGANDO...";


            estado.textContent =
                "Preparando Pokémon Azul...";


            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://cdn.emulatorjs.org/4.2.3/data/loader.js";


            script.onload =
                function () {

                    pantallaInicio.style.display =
                        "none";

                };


            script.onerror =
                function () {

                    boton.disabled =
                        false;


                    boton.textContent =
                        "REINTENTAR";


                    estado.textContent =
                        "No se pudo cargar el emulador. Comprueba la conexión.";

                };


            document.body.appendChild(
                script
            );

        }

    );


</script>


</body>

</html>
