<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Azul</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        #game {
            width: 100vw;
            height: 100vh;
        }


        #tituloPokemon {

            position: fixed;

            top: 11%;
            left: 0;

            width: 100%;

            z-index: 9999;

            text-align: center;

            pointer-events: none;
        }


        #tituloPokemon h1 {

            margin: 0;

            color: #2196f3;

            font-size: 36px;

            font-weight: 900;

            letter-spacing: 2px;

            line-height: 1.15;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }


        #tituloPokemon p {

            margin-top: 10px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1px;
        }

    </style>

</head>


<body>


<!-- TÍTULO INICIAL -->

<div id="tituloPokemon">

    <h1>
        POKÉMON<br>
        AZUL
    </h1>

    <p>
        EDICIÓN AZUL
    </p>

</div>


<!-- EMULADOR -->

<div id="game"></div>


<script>

    /*
    =========================================
    POKÉMON AZUL
    =========================================
    */


    /*
    DÓNDE SE CARGA EL EMULADOR
    */

    window.EJS_player = "#game";


    /*
    IMPORTANTE:

    Usamos mGBA aunque el archivo sea .gb
    */

    window.EJS_core = "mgba";


    /*
    HACE QUE LOS CONTROLES SEAN
    LOS DE GAME BOY.

    Así evitamos L/R de GBA.
    */

    window.EJS_controlScheme = "gb";


    /*
    NOMBRE DEL JUEGO
    */

    window.EJS_gameName =
        "pokemon-azul";


    /*
    ID ÚNICO

    Amarillo = 1001
    Azul     = 1002
    Verde    = 1003
    */

    window.EJS_gameID = 1002;


    /*
    ARCHIVO DE POKÉMON AZUL
    */

    window.EJS_gameUrl =
        "./roms/juego.gb";


    /*
    ARCHIVOS EMULATORJS
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";


    /*
    EL USUARIO PULSA INICIAR JUEGO
    */

    window.EJS_startOnLoaded = false;


    /*
    TEXTO DEL BOTÓN
    */

    window.EJS_startButtonName =
        "INICIAR JUEGO";


    /*
    BOTÓN CENTRADO
    */

    window.EJS_alignStartButton =
        "center";


    /*
    COLOR AZUL
    */

    window.EJS_color =
        "#2196f3";


    /*
    FONDO
    */

    window.EJS_backgroundColor =
        "#000000";


    /*
    GUARDADO PERIÓDICO
    */

    window.EJS_fixedSaveInterval =
        7000;


    /*
    =========================================
    CONFIGURACIÓN IMPORTANTE DE mGBA
    =========================================

    Aquí quitamos el marco de Super Game Boy.
    */

    window.EJS_defaultOptions = {

        /*
        NO MOSTRAR EL BORDE
        SUPER GAME BOY
        */

        "mgba_sgb_borders": "OFF",


        /*
        FORZAR GAME BOY COLOR

        Evita que Pokémon Azul arranque
        como Super Game Boy.
        */

        "mgba_gb_model":
            "Game Boy Color",


        /*
        GUARDADOS EN EL NAVEGADOR
        */

        "save-state-location":
            "browser"

    };


    /*
    CUANDO ARRANQUE EL JUEGO
    QUITAMOS EL TÍTULO
    */

    window.EJS_onGameStart =
        function () {

            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );

            if (titulo) {

                titulo.style.display =
                    "none";

            }

        };


</script>


<!-- EMULATORJS -->

<script src="https://cdn.emulatorjs.org/4.2.3/data/loader.js"></script>


</body>

</html>
