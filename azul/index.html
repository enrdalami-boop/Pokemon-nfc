<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Pokémon Azul</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }


        /* =========================
           TÍTULO
        ========================== */

        #tituloPokemon {
            position: fixed;
            top: 6%;
            left: 0;
            width: 100%;
            z-index: 9999;
            text-align: center;
            pointer-events: none;
        }


        #tituloPokemon .pokemon {
            margin: 0;

            color: #ffffff;

            font-size: 40px;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1;

            text-shadow:
                2px 2px 0 #2196f3,
                4px 4px 8px #000;
        }


        #tituloPokemon .azul {
            margin: 8px 0 0 0;

            color: #2196f3;

            font-size: 44px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;

            text-shadow:
                2px 2px 0 #ffffff,
                4px 4px 8px #000;
        }


        #tituloPokemon p {
            margin-top: 12px;

            color: white;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }


        /* =========================
           BLASTOISE
        ========================== */

        #blastoiseInicio {

            position: fixed;

            top: 36%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 230px;

            max-width: 60vw;

            height: auto;

            z-index: 9998;

            pointer-events: none;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            #tituloPokemon {
                top: 5%;
            }


            #tituloPokemon .pokemon {
                font-size: 36px;
                letter-spacing: 3px;
            }


            #tituloPokemon .azul {
                font-size: 39px;
                letter-spacing: 2px;
            }


            #tituloPokemon p {
                font-size: 13px;
                margin-top: 10px;
            }


            #blastoiseInicio {

                top: 36%;

                width: 220px;

                max-width: 60vw;
            }

        }


        /* =========================
           PANTALLAS BAJAS
        ========================== */

        @media (max-height: 700px) {

            #tituloPokemon {
                top: 4%;
            }


            #tituloPokemon .pokemon {
                font-size: 31px;
            }


            #tituloPokemon .azul {
                font-size: 34px;
            }


            #tituloPokemon p {
                font-size: 11px;
                margin-top: 8px;
            }


            #blastoiseInicio {

                top: 35%;

                width: 195px;
            }

        }

    </style>

</head>


<body>


<!-- PORTADA -->

<div id="tituloPokemon">

    <h1 class="pokemon">
        POKÉMON
    </h1>

    <h1 class="azul">
        AZUL
    </h1>

    <p>
        EDICIÓN AZUL
    </p>

</div>


<!-- BLASTOISE -->

<img
    id="blastoiseInicio"
    src="./blastoise.png"
    alt="Blastoise"
>


<!-- EMULADOR -->

<div id="game"></div>


<script>

    window.EJS_player = "#game";

    window.EJS_core = "gba";

    window.EJS_controlScheme = "gba";

    window.EJS_browserMode = "mobile";

    window.EJS_gameName =
        "pokemon-azul";

    window.EJS_gameID =
        1002;

    window.EJS_gameUrl =
        "./roms/juego.gba";

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/4.2.3/data/";

    window.EJS_startOnLoaded =
        false;

    window.EJS_startButtonName =
        "INICIAR JUEGO";

    window.EJS_alignStartButton =
        "center";

    window.EJS_color =
        "#2196f3";

    window.EJS_backgroundColor =
        "#000000";

    window.EJS_fixedSaveInterval =
        7000;

    window.EJS_defaultOptions = {

        "save-state-location":
            "browser"

    };


    window.EJS_onGameStart =
        function () {

            const titulo =
                document.getElementById(
                    "tituloPokemon"
                );

            const blastoise =
                document.getElementById(
                    "blastoiseInicio"
                );


            if (titulo) {
                titulo.style.display =
                    "none";
            }


            if (blastoise) {
                blastoise.style.display =
                    "none";
            }

        };

</script>


<script src="https://cdn.emulatorjs.org/4.2.3/data/loader.js"></script>


</body>

</html>
